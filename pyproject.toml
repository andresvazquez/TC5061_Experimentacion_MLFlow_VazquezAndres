[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "medical_cost"
version = "0.0.1"
description = "Actividad Individual - C\u00f3digo de experimentaci\u00f3n base con MLFlow."
authors = [
  { name = "Andr\u00e9s Eduardo V\u00e1zquez P\u00e9rez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.9"


[tool.ruff]
line-length = 99
src = ["medical_cost"]
include = ["pyproject.toml", "medical_cost/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["medical_cost"]
force-sort-within-sections = true